<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<title>Painel · Rosa Modas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap');
:root{
  --rosa:#E5197F; --rosa-esc:#C41169; --rosa-suave:#FDE8F1;
  --paper:#FFF7FA; --card:#FFF; --ink:#2E1622; --muted:#96707F; --line:#F5DDE8;
  --folha:#4F8A54; --mimosa:#C98B08;
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:40px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:16px;color:inherit}
.lbl{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.bar{position:sticky;top:0;z-index:20;display:flex;align-items:baseline;gap:6px;background:var(--card);
  border-bottom:2px solid var(--rosa);padding:calc(10px + env(safe-area-inset-top)) 16px 9px}
.bar i,.bar b{font-size:14px;font-weight:700;letter-spacing:.17em;font-style:normal}
.bar i{color:var(--ink)} .bar b{color:var(--rosa)}
.bar span{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}

.wrap{padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.box h3{font-size:14px;font-weight:600;margin:0 0 12px}
.hoje{text-align:center;padding:22px 16px}
.hoje .v{font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--rosa-esc);
  font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 2px}
.hoje .s{font-size:13px;color:var(--muted)}

.stat{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.folha{color:var(--folha)} .mimosa{color:var(--mimosa)} .rosa{color:var(--rosa)}

.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.mv{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border:0}
.mv-ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700}
.mv-in{background:#FBEEDC;color:var(--mimosa)} .mv-out{background:#E4F0E8;color:var(--folha)}
.mv-mid{flex:1;min-width:0}
.mv-mid b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-mid span{font-size:11px;color:var(--muted)}
.mv-val{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;flex:none}

.linha{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.linha:last-child{border:0}
.linha b{margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
.sw{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.14)}
.estampa{background:repeating-linear-gradient(45deg,#E8748A 0 4px,#F5E2C0 4px 8px,#8FB8DD 8px 12px)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#FBEEDC;color:var(--mimosa)}
.tag.zero{background:#F6E3E3;color:#A33B3B}

.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;outline:0}
.btn{display:block;width:100%;text-align:center;background:var(--rosa);color:#fff;border-radius:12px;
  padding:15px;font-size:16px;font-weight:600;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.aviso{text-align:center;padding:40px 24px;color:var(--muted);font-size:14px}
.err{background:#F6E3E3;color:#A33B3B;border-radius:11px;padding:12px 14px;font-size:13px;
  font-weight:500;margin-bottom:12px}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
@media (min-width:620px){.wrap{max-width:600px;margin:0 auto}}
</style>

<div class="bar"><i>ROSA</i><b>MODAS</b><span id="atualizado">painel</span></div>
<div class="wrap" id="app"><div class="aviso">Carregando…</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CORES={'Preto':'#1a1a1a','Branco':'#f7f5f0','Off white':'#ece4d6','Cinza':'#9a9ea6','Bege':'#d8c3a3',
'Nude':'#e2bfa9','Marrom':'#7a5236','Caramelo':'#b5773c','Vermelho':'#c0392b','Vinho':'#6d2036','Rosa':'#e9a3ba',
'Pink':'#df3f96','Coral':'#e8705a','Laranja':'#e57a35','Amarelo':'#f0c53c','Mostarda':'#c9962a','Verde':'#4a8c5c',
'Verde militar':'#5c6440','Menta':'#a5d6c0','Azul':'#2f6fb0','Azul claro':'#8fb8dd','Marinho':'#22335c',
'Jeans':'#4f7396','Lilás':'#b096d8','Roxo':'#6b3fa0','Dourado':'#c9a227','Prata':'#b9bdc3','Estampado':'estampa'};
const hexCor=n=>CORES[n]||'#c9c9c9';
const sw=c=>hexCor(c)==='estampa'?'<span class="sw estampa"></span>'
  :`<span class="sw" style="background:${hexCor(c)}"></span>`;

/* ---------- guarda a chave só neste aparelho ---------- */
const DB='painelrosa', ST='kv', K='cfg';
let _db=null;
function idb(){
  if(_db)return _db;
  _db=new Promise((ok,no)=>{const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(ST);
    r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);});
  return _db;
}
function idbOp(modo,fn){
  return idb().then(d=>new Promise((ok,no)=>{
    const tx=d.transaction(ST,modo), req=fn(tx.objectStore(ST));
    tx.oncomplete=()=>ok(req?req.result:undefined); tx.onerror=()=>no(tx.error);}));
}
let CFG={token:'',repo:'rosamodas/backup'};
const lerCfg=async()=>{try{const v=await idbOp('readonly',s=>s.get(K)); if(v)CFG=Object.assign(CFG,JSON.parse(v))}catch(e){}};
const gravarCfg=async()=>{try{await idbOp('readwrite',s=>s.put(JSON.stringify(CFG),K))}catch(e){}};

/* ---------- dados ---------- */
let D=null, periodo=0, timer=null;
async function buscar(){
  const r=await fetch('https://api.github.com/repos/'+CFG.repo+'/contents/resumo.json?ref=main',
    {headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github.raw'},cache:'no-store'});
  if(r.status===401||r.status===403) throw new Error('A chave não vale mais ou não tem acesso.');
  if(r.status===404) throw new Error('Ainda não existe resumo publicado. Peça para ela abrir o app.');
  if(!r.ok) throw new Error('Não consegui buscar agora (erro '+r.status+').');
  return await r.json();
}
const desde=d=>{const x=new Date();x.setHours(0,0,0,0);return x.getTime()-(d-1)*864e5};
function data(t){
  const d=new Date(t),h=new Date();h.setHours(0,0,0,0);
  const hora=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(d.getTime()>=h.getTime())return hora;
  if(d.getTime()>=h.getTime()-864e5)return 'ontem '+hora;
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+hora;
}

function telaChave(erro){
  $('app').innerHTML=`${erro?`<div class="err">${esc(erro)}</div>`:''}
    <div class="box">
      <h3>Conectar o painel</h3>
      <div style="margin-bottom:14px"><span class="lbl">Repositório privado</span>
        <input class="inp" id="c-repo" value="${esc(CFG.repo)}" autocomplete="off" spellcheck="false" style="margin-top:6px"></div>
      <div><span class="lbl">Chave de leitura</span>
        <input class="inp" id="c-token" type="password" placeholder="cole a chave" autocomplete="off" style="margin-top:6px"></div>
      <p class="hint">Fica guardada só neste celular. Use uma chave com permissão apenas de leitura
        no repositório do backup — este painel nunca escreve nada.</p>
      <button class="btn" onclick="conectar()">Conectar</button>
    </div>`;
}
async function conectar(){
  const t=($('c-token').value||'').trim(), rp=($('c-repo').value||'').trim();
  if(!t)return telaChave('Cole a chave para continuar.');
  CFG.token=t; CFG.repo=rp||CFG.repo;
  $('app').innerHTML='<div class="aviso">Conectando…</div>';
  try{ D=await buscar(); await gravarCfg(); pintar(); agendar(); }
  catch(e){ telaChave(e.message); }
}
async function atualizar(silencioso){
  try{ D=await buscar(); pintar(); }
  catch(e){ if(!silencioso) telaChave(e.message); }
}
function agendar(){ clearInterval(timer); timer=setInterval(()=>atualizar(true),60000); }

function pintar(){
  const movs=D.movimentos||[], prods=D.produtos||[];
  const hoje=movs.filter(m=>m.tipo==='venda'&&m.data>=desde(1));
  const totalHoje=hoje.reduce((a,m)=>a+m.total,0);
  const pecasHoje=hoje.reduce((a,m)=>a+m.qtd,0);

  const dias=periodo===0?1:periodo;
  const ms=periodo<0?movs:movs.filter(m=>m.data>=desde(dias));
  const vendas=ms.filter(m=>m.tipo==='venda');
  const receb=vendas.reduce((a,m)=>a+m.total,0);
  const invest=ms.filter(m=>m.tipo==='entrada').reduce((a,m)=>a+m.total,0);
  const lucro=vendas.reduce((a,m)=>a+(m.preco-m.custo)*m.qtd,0);
  const margem=receb>0?Math.round(lucro/receb*100):0;

  const emCusto=prods.reduce((a,p)=>a+p.custo*p.qtd,0);
  const emVenda=prods.reduce((a,p)=>a+p.preco*p.qtd,0);
  const unidades=prods.reduce((a,p)=>a+p.qtd,0);
  const acabando=prods.filter(p=>p.qtd>0&&p.qtd<=2).sort((a,b)=>a.qtd-b.qtd).slice(0,8);
  const zerados=prods.filter(p=>p.qtd<1).length;

  const segs=[[0,'Hoje'],[7,'7 dias'],[30,'30 dias'],[-1,'Tudo']];
  const ult=vendas.slice().sort((a,b)=>b.data-a.data).slice(0,15);

  $('atualizado').textContent='atualizado '+data(D.gerado);
  $('app').innerHTML=`
    <div class="box hoje">
      <span class="lbl">Vendido hoje</span>
      <div class="v">${brl(totalHoje)}</div>
      <div class="s">${pecasHoje} peça${pecasHoje===1?'':'s'} · ${hoje.length} venda${hoje.length===1?'':'s'}</div>
    </div>

    <div class="seg">${segs.map(([v,l])=>
      `<button class="chip" aria-pressed="${periodo===v}" onclick="periodo=${v};pintar()">${l}</button>`).join('')}</div>

    <div class="box"><span class="lbl">Dinheiro no período</span>
      <div class="stat" style="padding-top:8px"><span>Entrou<small>${vendas.reduce((a,m)=>a+m.qtd,0)} peças vendidas</small></span><b class="folha">${brl(receb)}</b></div>
      <div class="stat"><span>Saiu<small>compra de peças</small></span><b class="mimosa">− ${brl(invest)}</b></div>
      <div class="stat"><span>Lucro<small>${margem}% de margem</small></span><b class="rosa">${brl(lucro)}</b></div>
    </div>

    <div class="box"><span class="lbl">Estoque agora</span>
      <div class="stat" style="padding-top:8px"><span>Peças na loja<small>${zerados} esgotada${zerados===1?'':'s'}</small></span><b>${unidades}</b></div>
      <div class="stat"><span>Investido<small>o que foi pago</small></span><b class="mimosa">${brl(emCusto)}</b></div>
      <div class="stat"><span>Vale<small>se vender tudo</small></span><b class="folha">${brl(emVenda)}</b></div>
    </div>

    ${acabando.length?`<div class="box"><h3>Acabando</h3>
      ${acabando.map(p=>`<div class="linha">${sw(p.cor)}<span>${esc(p.nome)} · ${esc(p.tam)}</span>
        <b><span class="tag ${p.qtd<1?'zero':''}">${p.qtd} un</span></b></div>`).join('')}</div>`:''}

    <div class="box"><h3>Últimas vendas</h3>
      ${ult.length?ult.map(m=>`<div class="mv">
        <div class="mv-ic mv-out">↑</div>
        <div class="mv-mid"><b>${esc(m.nome)}</b><span>${m.qtd} un · ${esc(m.cor)} · ${esc(m.tam)} · ${data(m.data)}</span></div>
        <div class="mv-val folha">+ ${brl(m.total)}</div></div>`).join('')
        :'<p class="hint" style="margin:0">Nenhuma venda nesse período.</p>'}</div>

    <button class="btn ghost" onclick="atualizar()">Atualizar agora</button>
    <button class="btn ghost" onclick="telaChave()">Trocar chave</button>`;
}

(async()=>{
  await lerCfg();
  if(!CFG.token){ telaChave(); return; }
  try{ D=await buscar(); pintar(); agendar(); }
  catch(e){ telaChave(e.message); }
})();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&CFG.token&&D) atualizar(true); });
</script>
